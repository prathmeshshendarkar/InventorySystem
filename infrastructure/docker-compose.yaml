version: '3'
services:
  database:
    image: postgres:17
    container_name: order-system-database
    environment:
      POSTGRES_USER : postgres
      POSTGRES_PASSWORD : postgres
      POSTGRES_DB : order_service_db
    ports:
      - "5433:5432"
    volumes:
      - order_service_db:/var/lib/postgresql/data

volumes:
  order_service_db:
